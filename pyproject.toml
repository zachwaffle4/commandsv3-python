[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commands3"
version = "0.1.0"
description = "Python port of WPILib Commands v3"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "robotpy>=2027.0.0a7",
    "wpilib>=2027.0.0a7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]

[tool.hatch.build.targets.wheel]
packages = ["commands3"]

[tool.uv]
prerelease = "allow"
